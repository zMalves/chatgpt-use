<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Automator</title>
  <style>
    :root {
      --bg: #1e1e24;
      --card-bg: #282830;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #10a37f;
      --accent-hover: #0e8d6e;
      --border: #3f3f46;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      width: 360px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-online {
      background: rgba(16, 163, 127, 0.2);
      color: #34d399;
    }

    .status-offline {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .field-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 5px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .file-drop-area {
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      background: var(--card-bg);
      cursor: pointer;
      transition: border 0.2s;
    }

    .file-drop-area:hover {
      border-color: var(--accent);
    }

    .file-drop-area span {
      color: var(--text-muted);
      font-size: 11px;
    }

    #fileList {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 70px;
      overflow-y: auto;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #33333e;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .file-remove {
      color: var(--danger);
      cursor: pointer;
      font-weight: bold;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 500;
      font-size: 12px;
      transition: background 0.15s, opacity 0.15s;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      flex: 1;
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #3f3f46;
      color: var(--text);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #52525b;
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .response-card {
      margin-top: 12px;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      display: none;
    }

    .response-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .response-content {
      max-height: 140px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .copy-btn {
      background: transparent;
      color: var(--accent);
      padding: 2px 6px;
      font-size: 11px;
    }

    .copy-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>ChatGPT Use</h1>
    <div id="statusBadge" class="status-badge status-offline">
      <span class="status-dot"></span>
      <span id="statusText">Verificando...</span>
    </div>
  </div>

  <div class="field-group">
    <label for="promptInput">Mensagem / Pergunta:</label>
    <textarea id="promptInput" placeholder="Ex: Analise o arquivo em anexo e resuma os pontos principais..."></textarea>
  </div>

  <div class="field-group">
    <label>Arquivos / Documentos:</label>
    <div class="file-drop-area" id="dropArea">
      <span>Clique para anexar arquivos (PDF, imagens, docs...)</span>
      <input type="file" id="fileInput" multiple style="display: none;">
    </div>
    <div id="fileList"></div>
  </div>

  <div class="btn-row">
    <button id="sendBtn" class="btn-primary" disabled>Enviar Mensagem</button>
    <button id="newChatBtn" class="btn-secondary" title="Nova Conversa">Novo Chat</button>
  </div>

  <div id="responseCard" class="response-card">
    <div class="response-header">
      <span>Resposta do ChatGPT:</span>
      <button id="copyBtn" class="copy-btn">Copiar</button>
    </div>
    <div id="responseContent" class="response-content"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
